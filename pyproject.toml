[project]
name = "chat-bot"
version = "0.1.0"
description = "Authenticated FastAPI chatbot backed by Ollama"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "alembic==1.19.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "langchain-core==1.5.5",
    "langchain-ollama>=1.1.0",
    "langgraph==1.2.11",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
    "langchain>=1.3.15",
    "pgvector==0.5.0",
]

[dependency-groups]
dev = [
    "ipython==9.16.1",
]
